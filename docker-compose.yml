version: '3.8'

services:
  # MySQL数据库服务
  db:
    image: mysql:8.0
    container_name: vacation-student-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: vacation_student
      MYSQL_USER: vacation
      MYSQL_PASSWORD: vacation123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - vacation-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vacation-student-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/vacation_student?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      SERVER_PORT: 8000
      JWT_SECRET: VacationStudentManagementSystemSecretKey2026ForDockerOnly
      TZ: Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vacation-network

  # Vue3前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vacation-student-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - vacation-network

networks:
  vacation-network:
    driver: bridge

volumes:
  mysql_data:
